# Trien khai production len Vercel: khi push vao main, hoac bam "Run workflow" tren GitHub.
# Thu tu bat buoc: kiem thu xanh -> build (khong cham database) -> sao luu (ma hoa) -> migrate database -> deploy ban da build.
# Build truoc migrate de khoang ma cu chay tren schema moi chi con thoi gian day ban build len Vercel. next build khong
# truy van database: moi trang va route cham database goi connection() (tests/unit/pages-connection.test.ts), va lan
# build hong thi chua sao luu, chua migrate gi.
# Deploy do workflow nay goi Vercel CLI; tu deploy qua git cua Vercel da tat trong vercel.json,
# vi Vercel tu deploy ngay khi push, truoc buoc migrate.
name: Trien khai

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  kiem-thu:
    uses: ./.github/workflows/kiem-thu.yml

  production:
    name: Deploy production
    needs: kiem-thu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Kiem du secrets
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          thieu=""
          for ten in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PROD_DATABASE_URL BACKUP_PASSPHRASE; do
            if [ -z "${!ten}" ]; then thieu="$thieu $ten"; fi
          done
          if [ -n "$thieu" ]; then
            echo "::error::Chua dat secrets cua environment production:$thieu. Xem docs/huong-dan-phat-hanh.md, muc Tu dong deploy."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lay cau hinh du an tu Vercel
        run: npx --yes vercel@59.23.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: npx --yes vercel@59.23.2 build --prod --token="$VERCEL_TOKEN"
      - name: Sao luu database truoc khi migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_DIR: ${{ runner.temp }}/sao-luu
        run: |
          npm run db:backup
          for tep in "$BACKUP_DIR"/*.json; do
            gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
              --passphrase-fd 0 --output "$tep.gpg" "$tep" <<< "$BACKUP_PASSPHRASE"
            rm -f "$tep"
          done
      - name: Giu ban sao luu da ma hoa
        uses: actions/upload-artifact@v4
        with:
          name: sao-luu-${{ github.run_id }}
          path: ${{ runner.temp }}/sao-luu/*.gpg
          retention-days: 7
          if-no-files-found: error
      - name: Migrate database production
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npm run db:migrate
      - name: Deploy
        run: npx --yes vercel@59.23.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
